function expandDay(dayBlocks) {
  const out = [];
  let slot = 0;
  for (const b of dayBlocks) {
    out.push({ ...b, startSlot: slot, endSlot: slot + b.span - 1 });
    slot += b.span;
  }
  return out;
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

      const match = CLASS_STUDENTS.find(s => s.pin.toUpperCase() === savedPin.toUpperCase());

    }
  }, []);

  const handleLogin = (studentObj) => {
    localStorage.setItem("ece_student_pin", studentObj.pin);
    setUser(studentObj);
  };

  const handleLogout = () => {
    localStorage.removeItem("ece_student_pin");
    setUser(null);
  };

  if (!user) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  return (
    <div style={{ background: C.ink, color: C.text, minHeight: "100vh", display: "flex", justifyContent: "center" }}>

      s => s.pin.toUpperCase() === cleanPin || s.pin.endsWith(`-${cleanPin}`)

    } else {
      setError("Invalid PIN number! Only JNGP ECE C-26 students are allowed.");

function TimetablePage() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000); // Live tick every second
    return () => clearInterval(t);
  }, []);

  const todayName = now.toLocaleDateString("en-US", { weekday: "long" });
  const isTeachingDay = DAYS.includes(todayName);
  const nowMin = now.getHours() * 60 + now.getMinutes();

  // Find currently active slot index (0 to 7)
  const currentSlotIndex = SLOT_TIMES.findIndex(
    (s) => nowMin >= toMinutes(s.start) && nowMin < toMinutes(s.end)
  );

  const [selectedDay, setSelectedDay] = useState(
    isTeachingDay ? todayName : "Monday"
  );

  const dayBlocks = expandDay(TIMETABLE[selectedDay]);
  const isViewingToday = selectedDay === todayName && isTeachingDay;

  // Status message calculation
  let statusText = "Classes haven't started yet for today";
  if (!isTeachingDay) {
    statusText = "Holiday / No classes today";
  } else if (nowMin < toMinutes(SLOT_TIMES[0].start)) {
    statusText = "Classes start at 09:30 AM";
  } else if (nowMin >= toMinutes(SLOT_TIMES[SLOT_TIMES.length - 1].end)) {
    statusText = "Classes ended for today";
  } else if (currentSlotIndex >= 0) {
    const slot = SLOT_TIMES[currentSlotIndex];
    if (currentSlotIndex === 4) {
      statusText = "● LUNCH BREAK IN PROGRESS";
    } else {
      statusText = `● LIVE PERIOD IN PROGRESS (${slot.start} - ${slot.end})`;
    }
  } else {
    statusText = "Short break between periods";
  }

  return (
    <div style={{ padding: "16px 16px 8px" }}>
      {/* Days Tabs */}
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
        {DAYS.map((d) => {
          const active = d === selectedDay;
          const isTodayTag = d === todayName;
          return (
            <button
              key={d}
              onClick={() => setSelectedDay(d)}
              className="mono"
              style={{
                flexShrink: 0,
                padding: "8px 12px",
                borderRadius: 8,
                border: `1px solid ${active ? C.copper : C.line}`,
                background: active ? C.copperSoft : "transparent",
                color: active ? C.copper : C.text,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                gap: 4
              }}
            >
              <span style={{ fontSize: 11, letterSpacing: 0.5 }}>{d.slice(0, 3).toUpperCase()}</span>
              {isTodayTag && <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.copper, display: "inline-block" }}></span>}
            </button>
          );
        })}
      </div>

      {/* Real-time Status Alert */}
      <div style={{ fontSize: 11, color: isViewingToday && currentSlotIndex >= 0 ? C.copper : C.muted, marginTop: 12, marginBottom: 4, fontWeight: 600 }} className="mono">
        {statusText}
      </div>

      {/* Timetable Cards */}
      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
        {dayBlocks.map((b, i) => {
          const isLunch = b.s === "Lunch";
          const isLive = isViewingToday && currentSlotIndex >= b.startSlot && currentSlotIndex <= b.endSlot;
          const startTime = SLOT_TIMES[b.startSlot].start;
          const endTime = SLOT_TIMES[b.endSlot].end;

          return (
            <div
              key={i}
              className={isLive ? "live-card" : ""}
              style={{
                display: "flex",
                border: `1px solid ${isLive ? C.copper : C.line}`,
                borderRadius: 10,
                overflow: "hidden",
                background: isLive ? C.copperSoft : C.ink2,
                opacity: isLunch && !isLive ? 0.6 : 1,
                transition: "all 0.3s ease"
              }}
            >
              <div style={{ width: 6, background: isLive ? C.copper : isLunch ? "transparent" : C.ink3 }} />
              <div style={{ flex: 1, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontSize: 15, fontWeight: isLive ? 700 : 600, color: isLive ? C.copper : C.text }}>
                    {isLunch ? "Lunch Break" : b.s}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    {isLive && <span className="mono" style={{ fontSize: 9, background: C.copper, color: C.ink, padding: "2px 6px", borderRadius: 4, fontWeight: 700 }}>LIVE</span>}
                    <div className="mono" style={{ fontSize: 11, color: isLive ? C.copper : C.muted, fontWeight: isLive ? 700 : 400 }}>
                      {startTime} – {endTime}
                    </div>
                  </div>
                </div>
                {!isLunch && (
                  <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                    <
