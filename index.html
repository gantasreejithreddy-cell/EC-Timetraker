<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EC Time Tracker – JNGPT DECE C-26</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0F1826; color: #EAE5D6; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #1C2B47; border-radius: 4px; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* Tokens */
const C = {
  ink: "#0F1826",
  ink2: "#16223A",
  ink3: "#1C2B47",
  copper: "#C9814B",
  copperSoft: "rgba(201,129,75,0.16)",
  copperGlow: "rgba(201,129,75,0.45)",
  trace: "#5FA98C",
  text: "#EAE5D6",
  muted: "#8B93A8",
  line: "rgba(234,229,214,0.10)",
};

const SLOT_TIMES = [
  { start: "09:30", end: "10:20" },
  { start: "10:20", end: "11:10" },
  { start: "11:10", end: "12:00" },
  { start: "12:00", end: "12:50" },
  { start: "12:50", end: "13:30" },
  { start: "13:30", end: "14:20" },
  { start: "14:20", end: "15:10" },
  { start: "15:10", end: "16:00" },
];

const SUBJECT_CODES = {
  Chemistry: "CHEM",
  Physics: "PHY",
  Maths: "MATH",
  English: "ENG",
  BE: "BE",
  FCP: "FCP",
  Lunch: "—",
  "B S Lab": "BSL",
  "BE Lab": "BEL",
  "C & Python Lab": "CPL",
  "Engineering Drawing with CAD Lab": "CAD",
};

const TIMETABLE = {
  Monday: [
    { s: "Chemistry", span: 2 },
    { s: "Physics", span: 2 },
    { s: "Lunch", span: 1 },
    { s: "Maths", span: 2 },
    { s: "BE", span: 1 },
  ],
  Tuesday: [
    { s: "BE", span: 1 },
    { s: "B S Lab", span: 3 },
    { s: "Lunch", span: 1 },
    { s: "BE Lab", span: 3 },
  ],
  Wednesday: [
    { s: "Maths", span: 2 },
    { s: "Chemistry", span: 2 },
    { s: "Lunch", span: 1 },
    { s: "English", span: 2 },
    { s: "FCP", span: 1 },
  ],
  Thursday: [
    { s: "Maths", span: 1 },
    { s: "FCP", span: 3 },
    { s: "Lunch", span: 1 },
    { s: "Physics", span: 2 },
    { s: "BE", span: 1 },
  ],
  Friday: [
    { s: "English", span: 2 },
    { s: "BE", span: 2 },
    { s: "Lunch", span: 1 },
    { s: "C & Python Lab", span: 3 },
  ],
  Saturday: [
    { s: "English", span: 1 },
    { s: "Chemistry", span: 1 },
    { s: "Physics", span: 1 },
    { s: "FCP", span: 1 },
    { s: "Lunch", span: 1 },
    { s: "Engineering Drawing with CAD Lab", span: 3 },
  ],
};

const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function expandDay(dayBlocks) {
  const out = [];
  let slot = 0;
  for (const b of dayBlocks) {
    out.push({ ...b, startSlot: slot, endSlot: slot + b.span - 1 });
    slot += b.span;
  }
  return out;
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

const SUBJECTS = [
  { key: "chem", name: "Engineering Chemistry", code: "CHEM" },
  { key: "phy", name: "Engineering Physics", code: "PHY" },
  { key: "math", name: "Mathematics I", code: "MATH" },
  { key: "eng", name: "English", code: "ENG" },
  { key: "be", name: "Basic Electronics", code: "BE" },
  { key: "fcp", name: "FCP (C & Python)", code: "FCP" },
  { key: "cad", name: "Engineering Drawing & CAD", code: "CAD" },
];

const CATEGORIES = ["Notes & Slides", "Lab Manuals & Diagrams", "Previous Year Papers"];

function App() {
  const [tab, setTab] = useState("timetable");

  return (
    <div style={{ background: C.ink, color: C.text, minHeight: "100vh", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 480, minHeight: "100vh", display: "flex", flexDirection: "column" }}>
        <Header />
        <div style={{ flex: 1, overflowY: "auto", paddingBottom: 90 }}>
          {tab === "timetable" && <TimetablePage />}
          {tab === "notes" && <NotesPage />}
          {tab === "chat" && <ChatPage />}
          {tab === "exams" && <ExamsPage />}
        </div>
        <BottomNav active={tab} onChange={setTab} />
      </div>
    </div>
  );
}

function Header() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{ padding: "18px 20px 14px", borderBottom: `1px solid ${C.line}`, background: `linear-gradient(180deg, ${C.ink2}, ${C.ink})` }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div className="mono" style={{ fontSize: 11, color: C.copper, letterSpacing: 1.5 }}>002 · JNGPT RAMANTHAPUR</div>
          <div style={{ fontSize: 20, fontWeight: 700, marginTop: 2 }}>DECE — I Year</div>
          <div style={{ fontSize: 12, color: C.muted, marginTop: 1 }}>Odd Semester · 2026–27</div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div className="mono" style={{ fontSize: 18, fontWeight: 600 }}>
            {now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true })}
          </div>
          <div style={{ fontSize: 11, color: C.muted }}>
            {now.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" })}
          </div>
        </div>
      </div>
    </div>
  );
}

function BottomNav({ active, onChange }) {
  const navItems = [
    { id: "timetable", label: "Timetable", icon: "calendar" },
    { id: "notes", label: "Notes", icon: "book-open" },
    { id: "chat", label: "Chat", icon: "message-square" },
    { id: "exams", label: "Exams", icon: "timer" },
  ];

  return (
    <div style={{ position: "fixed", bottom: 0, width: "100%", maxWidth: 480, display: "flex", borderTop: `1px solid ${C.line}`, background: C.ink2, boxShadow: "0 -8px 24px rgba(0,0,0,0.35)", zIndex: 100 }}>
      {navItems.map((t) => {
        const isActive = t.id === active;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} style={{ flex: 1, background: "transparent", border: "none", padding: "10px 4px 12px", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer", color: isActive ? C.copper : C.muted }}>
            <i data-lucide={t.icon} style={{ width: 20, height: 20 }}></i>
            <span className="mono" style={{ fontSize: 10, letterSpacing: 0.4 }}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function TimetablePage() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 15000);
    return () => clearInterval(t);
  }, []);

  const isTeachingDay = DAYS.includes(now.toLocaleDateString("en-US", { weekday: "long" }));
  const currentDayName = now.toLocaleDateString("en-US", { weekday: "long" });
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const currentSlot = SLOT_TIMES.findIndex(
    (s) => nowMin >= toMinutes(s.start) && nowMin < toMinutes(s.end)
  );

  const [selectedDay, setSelectedDay] = useState(
    DAYS.includes(currentDayName) ? currentDayName : "Monday"
  );

  const dayBlocks = expandDay(TIMETABLE[selectedDay]);
  const isViewingToday = selectedDay === currentDayName && isTeachingDay;

  return (
    <div style={{ padding: "16px 16px 8px" }}>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
        {DAYS.map((d) => {
          const active = d === selectedDay;
          const isToday = d === currentDayName && isTeachingDay;
          return (
            <button key={d} onClick={() => setSelectedDay(d)} className="mono" style={{ flexShrink: 0, padding: "8px 12px", borderRadius: 8, border: `1px solid ${active ? C.copper : C.line}`, background: active ? C.copperSoft : "transparent", color: active ? C.copper : C.text, cursor: "pointer", position: "relative" }}>
              <span style={{ fontSize: 11, letterSpacing: 0.5 }}>{d.slice(0, 3).toUpperCase()}</span>
            </button>
          );
        })}
      </div>

      {isViewingToday && (
        <div style={{ fontSize: 11, color: C.muted, marginTop: 10, marginBottom: 2 }} className="mono">
          {currentSlot >= 0 ? "● LIVE — period in progress" : nowMin < toMinutes(SLOT_TIMES[0].start) ? "Classes haven't started yet" : "Between periods"}
        </div>
      )}

      <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
        {dayBlocks.map((b, i) => {
          const isLunch = b.s === "Lunch";
          const isLive = isViewingToday && currentSlot >= b.startSlot && currentSlot <= b.endSlot;
          const startTime = SLOT_TIMES[b.startSlot].start;
          const endTime = SLOT_TIMES[b.endSlot].end;
          return (
            <div key={i} style={{ display: "flex", border: `1px solid ${isLive ? C.copper : C.line}`, borderRadius: 10, overflow: "hidden", background: isLive ? C.copperSoft : C.ink2, opacity: isLunch ? 0.6 : 1 }}>
              <div style={{ width: 4, background: isLive ? C.copper : isLunch ? "transparent" : C.ink3 }} />
              <div style={{ flex: 1, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{isLunch ? "Lunch Break" : b.s}</div>
                  <div className="mono" style={{ fontSize: 10, color: isLive ? C.copper : C.muted }}>{startTime} – {endTime}</div>
                </div>
                {!isLunch && (
                  <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                    <span className="mono" style={{ fontSize: 10, color: C.muted }}>{SUBJECT_CODES[b.s] || ""}</span>
                    <span className="mono" style={{ fontSize: 10, color: C.muted }}>· {b.span} period{b.span > 1 ? "s" : ""}</span>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function NotesPage() {
  const [open, setOpen] = useState(SUBJECTS[0].key);
  const [resources, setResources] = useState({});
  const [formKey, setFormKey] = useState(null);
  const [title, setTitle] = useState("");
  const [url, setUrl] = useState("");

  function addResource(subjKey, cat) {
    if (!title.trim() || !url.trim()) return;
    const k = `${subjKey}::${cat}`;
    setResources((r) => ({
      ...r,
      [k]: [...(r[k] || []), { title: title.trim(), url: url.trim() }],
    }));
    setTitle(""); setUrl(""); setFormKey(null);
  }

  return (
    <div style={{ padding: "16px 16px 8px" }}>
      <div style={{ fontSize: 12, color: C.muted, marginBottom: 12 }}>Organize Google Drive or resource links by subject.</div>
      {SUBJECTS.map((subj) => {
        const isOpen = open === subj.key;
        return (
          <div key={subj.key} style={{ border: `1px solid ${C.line}`, borderRadius: 10, marginBottom: 8, background: C.ink2, overflow: "hidden" }}>
            <button onClick={() => setOpen(isOpen ? null : subj.key)} style={{ width: "100%", background: "transparent", border: "none", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: C.text }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div className="mono" style={{ fontSize: 10, color: C.copper, border: `1px solid ${C.copper}`, borderRadius: 5, padding: "2px 6px" }}>{subj.code}</div>
                <span style={{ fontSize: 14, fontWeight: 600 }}>{subj.name}</span>
              </div>
            </button>
            {isOpen && (
              <div style={{ padding: "0 14px 14px", display: "flex", flexDirection: "column", gap: 10 }}>
                {CATEGORIES.map((cat) => {
                  const k = `${subj.key}::${cat}`;
                  const items = resources[k] || [];
                  const isFormOpen = formKey === k;
                  return (
                    <div key={cat} style={{ borderTop: `1px solid ${C.line}`, paddingTop: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div style={{ fontSize: 12, color: C.muted }}>{cat}</div>
                        <button onClick={() => setFormKey(isFormOpen ? null : k)} className="mono" style={{ background: "transparent", border: "none", color: C.trace, cursor: "pointer", fontSize: 10 }}>+ ADD</button>
                      </div>
                      {items.map((it, idx) => (
                        <a key={idx} href={it.url} target="_blank" rel="noopener noreferrer" style={{ display: "block", padding: "6px 8px", background: C.ink, borderRadius: 6, border: `1px solid ${C.line}`, textDecoration: "none", color: C.text, fontSize: 12, marginTop: 4 }}>{it.title}</a>
                      ))}
                      {isFormOpen && (
                        <div style={{ marginTop: 8, padding: 10, background: C.ink, borderRadius: 8, border: `1px solid ${C.line}`, display: "flex", flexDirection: "column", gap: 6 }}>
                          <input type="text" placeholder="Title" value={title} onChange={(e) => setTitle(e.target.value)} style={{ background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 6, padding: "6px", color: C.text, fontSize: 12 }} />
                          <input type="text" placeholder="URL Link" value={url} onChange={(e) => setUrl(e.target.value)} style={{ background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 6, padding: "6px", color: C.text, fontSize: 12 }} />
                          <button onClick={() => addResource(subj.key, cat)} style={{ background: C.copper, border: "none", borderRadius: 6, padding: "6px", color: C.ink, fontWeight: 600, fontSize: 11, cursor: "pointer" }}>Save Link</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ChatPage() {
  const [messages, setMessages] = useState([
    { id: 1, sender: "System", text: "Welcome to DECE I Year class chat!", time: "09:00 AM" },
  ]);
  const [input, setInput] = useState("");
  const [senderName, setSenderName] = useState("");

  function sendMessage(e) {
    e.preventDefault();
    if (!input.trim()) return;
    const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    setMessages((prev) => [...prev, { id: Date.now(), sender: senderName.trim() || "Student", text: input.trim(), time: timeStr }]);
    setInput("");
  }

  return (
    <div style={{ padding: "16px", display: "flex", flexDirection: "column" }}>
      <input type="text" placeholder="Your Name" value={senderName} onChange={(e) => setSenderName(e.target.value)} style={{ background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px", color: C.text, fontSize: 12, marginBottom: 10 }} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 8, marginBottom: 12, maxHeight: "50vh", overflowY: "auto" }}>
        {messages.map((m) => (
          <div key={m.id} style={{ background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 10px" }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span className="mono" style={{ fontSize: 11, color: C.copper, fontWeight: 600 }}>{m.sender}</span>
              <span className="mono" style={{ fontSize: 10, color: C.muted }}>{m.time}</span>
            </div>
            <div style={{ fontSize: 13, marginTop: 2 }}>{m.text}</div>
          </div>
        ))}
      </div>
      <form onSubmit={sendMessage} style={{ display: "flex", gap: 8 }}>
        <input type="text" placeholder="Write a message..." value={input} onChange={(e) => setInput(e.target.value)} style={{ flex: 1, background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px", color: C.text, fontSize: 13 }} />
        <button type="submit" style={{ background: C.copper, border: "none", borderRadius: 8, padding: "0 16px", color: C.ink, fontWeight: 600 }}>Send</button>
      </form>
    </div>
  );
}

function ExamsPage() {
  const examSchedule = [
    { name: "Unit Test – I (Mid-1)", date: "Oct 12, 2026 – Oct 14, 2026" },
    { name: "Unit Test – II (Mid-2)", date: "Jan 21, 2027 – Jan 23, 2027" },
    { name: "Board Practical Exams", date: "May 03, 2027 – May 07, 2027" },
    { name: "Board Theory End Exams", date: "May 10, 2027 Onwards" },
  ];

  return (
    <div style={{ padding: "16px" }}>
      <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: C.copper, marginBottom: 10 }}>EXAM SCHEDULE (2026–27)</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {examSchedule.map((ex, idx) => (
          <div key={idx} style={{ background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px" }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>{ex.name}</div>
            <div className="mono" style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{ex.date}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Render icons after DOM load
setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 500);
</script>

</body>
</html>
