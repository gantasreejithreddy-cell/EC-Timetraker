const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function expandDay(dayBlocks) {
  const out = [];
  let slot = 0;
  for (const b of dayBlocks) {
    out.push({ ...b, startSlot: slot, endSlot: slot + b.span - 1 });
    slot += b.span;
  }
  return out;
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

    if (savedPin) {
      const match = CLASS_STUDENTS.find(s => s.pin.toUpperCase() === savedPin.toUpperCase());
      if (match) setUser(match);
    }
  }, []);

  const handleLogin = (studentObj) => {
    localStorage.setItem("ece_student_pin", studentObj.pin);
    setUser(studentObj);
  };

  const handleLogout = () => {
    localStorage.removeItem("ece_student_pin");
    setUser(null);
  };

  if (!user) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  return (
    <div style={{ background: C.bg, color: C.text, minHeight: "100vh", display: "flex", justifyContent: "center" }}>

  );
}

      s => s.pin.toUpperCase() === cleanPin || s.pin.endsWith(`-${cleanPin}`)

function TimetablePage() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const todayName = now.toLocaleDateString("en-US", { weekday: "long" });
  const isTeachingDay = DAYS.includes(todayName);
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const currentSlotIndex = SLOT_TIMES.findIndex(
    (s) => nowMin >= toMinutes(s.start) && nowMin < toMinutes(s.end)
  );

  const [selectedDay, setSelectedDay] = useState(isTeachingDay ? todayName : "Monday");
  const dayBlocks = expandDay(TIMETABLE[selectedDay]);
  const isViewingToday = selectedDay === todayName && isTeachingDay;

  let statusText = "Classes haven't started yet today";
  if (!isTeachingDay) {
    statusText = "Holiday / No classes scheduled today";
  } else if (nowMin < toMinutes(SLOT_TIMES[0].start)) {
    statusText = "Classes start at 09:30 AM";
  } else if (nowMin >= toMinutes(SLOT_TIMES[SLOT_TIMES.length - 1].end)) {
    statusText = "Classes finished for today";
  } else if (currentSlotIndex >= 0) {
    const slot = SLOT_TIMES[currentSlotIndex];
    if (currentSlotIndex === 4) {
      statusText = "🍱 LUNCH BREAK IN PROGRESS";
    } else {
      statusText = `⚡ LIVE PERIOD IN PROGRESS (${slot.start} - ${slot.end})`;
    }
  } else {
    statusText = "Short break between classes";
  }

  return (
    <div style={{ padding: "16px" }}>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 6 }}>
        {DAYS.map((d) => {
          const active = d === selectedDay;
          const isTodayTag = d === todayName;
          return (
            <button
              key={d}
              onClick={() => setSelectedDay(d)}
              className="mono"
              style={{
                flexShrink: 0, padding: "10px 14px", borderRadius: 12,
                border: `1px solid ${active ? C.primary : C.cardBorder}`,
                background: active ? C.gradientBg : C.card,
                color: "#FFF", cursor: "pointer", fontWeight: 700, fontSize: 11,
                display: "flex", alignItems: "center", gap: 6, boxShadow: active ? `0 4px 12px ${C.primaryGlow}` : "none"
              }}
            >
              <span>{d.slice(0, 3).toUpperCase()}</span>
              {isTodayTag && <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.accent }}></span>}
            </button>
          );
        })}
      </div>

      <div className="mono" style={{ fontSize: 12, color: isViewingToday && currentSlotIndex >= 0 ? C.accent : C.muted, marginTop: 14, marginBottom: 10, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>
        {statusText}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {dayBlocks.map((b, i) => {
          const isLunch = b.s === "Lunch";
          const details = SUBJECT_DETAILS[b.s] || { code: "SUB", icon: "📖", color: C.primary };
          const isLive = isViewingToday && currentSlotIndex >= b.startSlot && currentSlotIndex <= b.endSlot;
          const startTime = SLOT_TIMES[b.startSlot].start;
          const endTime = SLOT_TIMES[b.endSlot].end;

          return (
            <div
              key={i}
              style={{
                display: "flex", alignItems: "center", padding: "14px 16px", borderRadius: 16,
                background: isLive ? "rgba(99, 102, 241, 0.15)" : C.card,
                border: `1px solid ${isLive ? C.primary : C.cardBorder}`,
                boxShadow: isLive ? `0 0 20px ${C.primaryGlow}` : "0 4px 6px rgba(0,0,0,0.1)"
              }}
            >
              <div style={{
                width: 44, height: 44, borderRadius: 12, background: "rgba(255,255,255,0.05)",
                display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, marginRight: 14
              }}>
                {details.icon}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontSize: 15, fontWeight: 700, color: isLive ? C.primary : C.text }}>
                    {b.s}
                  </div>
                  <div className="mono" style={{ fontSize: 11, color: isLive ? C.accent : C.muted, fontWeight: 700 }}>
                    {startTime} – {endTime}
                  </div>
                </div>
                {!isLunch && (
                  <div style={{ display: "flex", gap: 8, marginTop: 4, alignItems: "center" }}>
                    <span className="mono" style={{ fontSize: 10, background: "rgba(255,255,255,0.08)", padding: "2px 6px", borderRadius: 4, color: details.color, fontWeight: 700 }}>
                      {details.code}
                    </span>
                    <span className="mono" style={{ fontSize: 11, color: C.muted }}>
                      {b.span} Period{b.span > 1 ? "s" : ""}
                    </span>
                    {isLive && <span className="mono" style={{ fontSize: 9, background: C.accent, color: "#000", padding: "2px 6px", borderRadius: 4, fontWeight: 800 }}>LIVE NOW</span>}
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
