  Tuesday: [ { s: "BE", span: 1 }, { s: "B S Lab", span: 3 }, { s: "Lunch", span: 1 }, { s: "BE Lab", span: 3 } ],
  Wednesday: [ { s: "Maths", span: 2 }, { s: "Chemistry", span: 2 }, { s: "Lunch", span: 1 }, { s: "English", span: 2 }, { s: "FCP", span: 1 } ],

const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function expandDay(dayBlocks) {
  const out = [];
  let slot = 0;
  for (const b of dayBlocks) {
    out.push({ ...b, startSlot: slot, endSlot: slot + b.span - 1 });
    slot += b.span;
  }
  return out;
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function TimetablePage() {
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const todayName = now.toLocaleDateString("en-US", { weekday: "long" });
  const isTeachingDay = DAYS.includes(todayName);
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const currentSlotIndex = SLOT_TIMES.findIndex(
    (s) => nowMin >= toMinutes(s.start) && nowMin < toMinutes(s.end)
  );

  const [selectedDay, setSelectedDay] = useState(
    isTeachingDay ? todayName : "Monday"
  );

  const dayBlocks = expandDay(TIMETABLE[selectedDay]);
  const isViewingToday = selectedDay === todayName && isTeachingDay;

  let statusText = "Classes haven't started yet for today";
  if (!isTeachingDay) {
    statusText = "Holiday / No classes today";
  } else if (nowMin < toMinutes(SLOT_TIMES[0].start)) {
    statusText = "Classes start at 09:30 AM";
  } else if (nowMin >= toMinutes(SLOT_TIMES[SLOT_TIMES.length - 1].end)) {
    statusText = "Classes ended for today";
  } else if (currentSlotIndex >= 0) {
    const slot = SLOT_TIMES[currentSlotIndex];
    if (currentSlotIndex === 4) {
      statusText = "● LUNCH BREAK IN PROGRESS";
    } else {
      statusText = `● LIVE PERIOD IN PROGRESS (${slot.start} - ${slot.end})`;
    }
  } else {
    statusText = "Short break between periods";
  }

  return (
    <div style={{ padding: "16px 16px 8px" }}>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
        {DAYS.map((d) => {
          const active = d === selectedDay;
          const isTodayTag = d === todayName;
          return (
            <button
              key={d}
              onClick={() => setSelectedDay(d)}
              className="mono"
              style={{
                flexShrink: 0, padding: "8px 12px", borderRadius: 8,
                border: `1px solid ${active ? C.copper : C.line}`,
                background: active ? C.copperSoft : "transparent",
                color: active ? C.copper : C.text, cursor: "pointer",
                display: "flex", alignItems: "center", gap: 4
              }}
            >
              <span style={{ fontSize: 11, letterSpacing: 0.5 }}>{d.slice(0, 3).toUpperCase()}</span>
              {isTodayTag && <span style={{ width: 6, height: 6, borderRadius: "50%", background: C.copper, display: "inline-block" }}></span>}
            </button>
          );
        })}
      </div>

      <div style={{ fontSize: 11, color: isViewingToday && currentSlotIndex >= 0 ? C.copper : C.muted, marginTop: 12, marginBottom: 4, fontWeight: 600 }} className="mono">
        {statusText}
      </div>

      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
        {dayBlocks.map((b, i) => {
          const isLunch = b.s === "Lunch";
          const isLive = isViewingToday && currentSlotIndex >= b.startSlot && currentSlotIndex <= b.endSlot;
          const startTime = SLOT_TIMES[b.startSlot].start;
          const endTime = SLOT_TIMES[b.endSlot].end;

          return (
            <div
              key={i}
              style={{
                display: "flex", border: `1px solid ${isLive ? C.copper : C.line}`, borderRadius: 10,
                overflow: "hidden", background: isLive ? C.copperSoft : C.ink2, opacity: isLunch && !isLive ? 0.6 : 1,
                boxShadow: isLive ? `0 0 12px ${C.copperSoft}` : "none", transition: "all 0.3s ease"
              }}
            >
              <div style={{ width: 6, background: isLive ? C.copper : isLunch ? "transparent" : C.ink3 }} />
              <div style={{ flex: 1, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontSize: 15, fontWeight: isLive ? 700 : 600, color: isLive ? C.copper : C.text }}>
                    {isLunch ? "Lunch Break" : b.s}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    {isLive && <span className="mono" style={{ fontSize: 9, background: C.copper, color: C.ink, padding: "2px 6px", borderRadius: 4, fontWeight: 700 }}>LIVE</span>}
                    <div className="mono" style={{ fontSize: 11, color: isLive ? C.copper : C.muted, fontWeight: isLive ? 700 : 400 }}>
                      {startTime} – {endTime}
                    </div>
                  </div>
                </div>
                {!isLunch && (
                  <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                    <span className="mono" style={{ fontSize: 11, color: isLive ? C.copper : C.muted, fontWeight: 600 }}>{SUBJECT_CODES[b.s] || ""}</span>
                    <span className="mono" style={{ fontSize: 11, color: C.muted }}>· {b.span} period{b.span > 1 ? "s" : ""}</span>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  );
}

function AIChatPage() {
  const [messages, setMessages] = useState([
    { id: 1, sender: "AI Assistant", text: "Hello ECE Student! I'm your JNGP AI Study Buddy. Ask me any doubt regarding Chemistry, Physics, Maths, BE, or FCP!", time: "Just now" }
  ]);
  const [input, setInput] = useState("");

  const handleSend = (text) => {
    const queryText = text || input;
    if (!queryText.trim()) return;

    const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const userMsg = { id: Date.now(), sender: "You", text: queryText, time: timeStr };
    setMessages((prev) => [...prev, userMsg]);
    setInput("");

    setTimeout(() => {
      let aiReply = "That's a great question regarding ECE I-Year! Please check your recommended textbook or consult your faculty for detailed diagrams.";
      const q = queryText.toLowerCase();
      if (q.includes("ohm")) aiReply = "Ohm's Law states V = I * R. Voltage equals Current multiplied by Resistance.";
      else if (q.includes("kirchhoff") || q.includes("kcl")) aiReply = "KCL: Sum of currents entering a node equals currents leaving. KVL: Sum of voltage drops in a loop equals zero.";
      else if (q.includes("python") || q.includes("fcp")) aiReply = "FCP covers C & Python fundamentals like loops, functions, and standard data structures.";

      setMessages((prev) => [...prev, { id: Date.now() + 1, sender: "AI Assistant", text: aiReply, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) }]);
    }, 600);
  };

  return (
    <div style={{ padding: "16px", display: "flex", flexDirection: "column", height: "calc(100vh - 160px)" }}>
      <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 10, paddingRight: 2 }}>
        {messages.map((m) => (
          <div key={m.id} style={{ alignSelf: m.sender === "You" ? "flex-end" : "flex-start", maxWidth: "85%", background: m.sender === "You" ? C.copper : C.ink2, color: m.sender === "You" ? C.ink : C.text, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 12px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 2 }}>
              <span style={{ fontSize: 11, fontWeight: 700 }}>{m.sender}</span>
              <span style={{ fontSize: 9, opacity: 0.7 }}>{m.time}</span>
            </div>
            <div style={{ fontSize: 13, lineHeight: "1.4" }}>{m.text}</div>
          </div>
        ))}
      </div>
      <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <input type="text" placeholder="Ask an ECE doubt..." value={input} onChange={(e) => setInput(e.target.value)} style={{ flex: 1, background: C.ink2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px", color: C.text, fontSize: 13 }} />
        <button type="submit" style={{ background: C.copper, border: "none", borderRadius: 8, padding: "0 16px", color: C.ink, fontWeight: 700, cursor: "pointer" }}>Ask</button>
      </form>
    </div>
  );
}
