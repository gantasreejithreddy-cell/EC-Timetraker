<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8"/>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet"/>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  
  :root {
    --bg: #070B13;
    --card: rgba(15, 23, 42, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --cyan: #06B6D4;
    --violet: #8B5CF6;
    --pink: #EC4899;
    --emerald: #10B981;
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
  }

  html, body { 
    height: 100%; 
    width: 100%; 
    background: var(--bg); 
    color: var(--text-primary); 
    display: flex; 
    justify-content: center;
    background-image: 
      radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
    background-attachment: fixed;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  #app { 
    width: 100%; 
    max-width: 480px; 
    height: 100vh; 
    height: 100dvh; 
    display: flex; 
    flex-direction: column; 
    position: relative; 
    overflow: hidden;
    border-left: 1px solid var(--card-border);
    border-right: 1px solid var(--card-border);
  }

  /* Login Screen */
  #loginScreen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    padding: 24px;
  }

  .login-box {
    width: 100%;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
  }

  .gradient-btn {
    background: linear-gradient(135deg, #06B6D4 0%, #8B5CF6 50%, #EC4899 100%);
    border: none;
    color: #FFF;
    font-weight: 800;
    border-radius: 14px;
    padding: 14px 20px;
    cursor: pointer;
    text-align: center;
    width: 100%;
    font-size: 14px;
    box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.5);
    transition: transform 0.2s ease;
  }
  .gradient-btn:active { transform: scale(0.98); }

  /* Main Container */
  #mainApp {
    display: none;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow-y: auto;
    padding: 16px;
    gap: 16px;
  }

  /* Header Card */
  .header-card {
    background: var(--card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .highlight-name {
    font-size: 16px;
    font-weight: 900;
    background: linear-gradient(90deg, #38BDF8, #818CF8, #EC4899);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: nameShift 4s linear infinite;
    display: inline-block;
  }

  @keyframes nameShift {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* SBTET Attendance Top Bar */
  .attendance-banner {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(6, 182, 212, 0.12));
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .attendance-btn {
    background: #10B981;
    color: #042F2E;
    font-weight: 800;
    font-size: 12px;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  /* Ongoing Class Spotlight Hero */
  .spotlight-card {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(236, 72, 153, 0.2) 100%);
    border: 2px solid #8B5CF6;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.35);
    position: relative;
    overflow: hidden;
  }

  .spotlight-card.idle {
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: none;
  }

  .live-pill {
    background: linear-gradient(90deg, #10B981, #06B6D4);
    color: #032018;
    font-size: 10px;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #032018;
    animation: livePulse 1.2s infinite ease-in-out;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }

  /* Day Selector Pills */
  .day-carousel {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .day-carousel::-webkit-scrollbar { display: none; }

  .day-pill {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .day-pill.active {
    background: linear-gradient(135deg, #06B6D4, #8B5CF6);
    border-color: transparent;
    color: #FFF;
    box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
  }

  /* Timeline Period Item */
  .period-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: transform 0.2s ease;
  }

  .period-item.active-item {
    border: 1px solid var(--cyan);
    background: rgba(6, 182, 212, 0.1);
  }

  .subject-name {
    font-size: 15px;
    font-weight: 800;
    color: #FFF;
  }

  .footer-tag {
    text-align: center;
    font-size: 11px;
    color: var(--pink);
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 8px 0 16px 0;
  }
</style>

const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
let currentUser = null;
let selectedDay = "Monday";

function init() {
  const now = new Date();
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const currentDayName = dayNames[now.getDay()];
  
  if (DAYS.includes(currentDayName)) {
    selectedDay = currentDayName;
  }

  const saved = localStorage.getItem("ece_user");
  if(saved) {
    currentUser = JSON.parse(saved);
    showApp();
  }
  updateClock();
  setInterval(updateClock, 1000);
}

function handleLogin() {
  const val = document.getElementById("pinInput").value.trim().toUpperCase();
  if(!val) return;
  
  const found = STUDENTS.find(s => s.pin.toUpperCase().includes(val) || val.includes(s.pin.split('-').pop()));
  if(found) {
    currentUser = found;
    localStorage.setItem("ece_user", JSON.stringify(currentUser));
    showApp();
  } else {
    document.getElementById("loginError").innerText = "Invalid PIN! Please check and try again.";
    document.getElementById("loginError").style.display = "block";
  }
}

function handleLogout() {
  localStorage.removeItem("ece_user");
  location.reload();
}

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "flex";
  
  document.getElementById("userName").innerText = currentUser.name;
  document.getElementById("userPin").innerText = currentUser.pin;
  
  renderDayButtons();
  renderDashboard();
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  document.getElementById("date").innerText = now.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  renderDashboard();
}

function renderDayButtons() {
  const container = document.getElementById("daySelector");
  container.innerHTML = DAYS.map(d => `
    <button onclick="selectDay('${d}')" class="day-pill ${d === selectedDay ? 'active' : ''}">
      ${d.slice(0,3).toUpperCase()}
    </button>
  `).join('');
}

function selectDay(d) { 
  selectedDay = d; 
  renderDayButtons(); 
  renderDashboard(); 
}

function getCurrentPeriodId() {
  const now = new Date();
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const todayName = dayNames[now.getDay()];

  if (selectedDay !== todayName) return null;

  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  for (let slot of PERIOD_SLOTS) {
    const [sHours, sMins] = slot.start.split(":").map(Number);
    const [eHours, eMins] = slot.end.split(":").map(Number);
    const startTotal = sHours * 60 + sMins;
    const endTotal = eHours * 60 + eMins;

    if (currentMinutes >= startTotal && currentMinutes < endTotal) {
      return slot.id;
    }
  }
  return null;
}

function renderDashboard() {
  const activePeriodId = getCurrentPeriodId();
  const list = TIMETABLE[selectedDay] || [];
  
  const activeSlot = PERIOD_SLOTS.find(s => s.id === activePeriodId);
  const activeSubject = list.find(item => item.periodId === activePeriodId);

  // Spotlight Section
  const spotlightEl = document.getElementById("spotlightContainer");
  if (activeSlot && activeSubject) {
    spotlightEl.innerHTML = `

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <div class="live-pill"><span class="live-dot"></span> LIVE CLASS ONGOING</div>
          <span style="font-size: 24px;">${activeSubject.subject === 'LUNCH' ? '🍱' : activeSubject.subject.includes('LAB') ? '💻' : '⚡'}</span>
        </div>
        <div style="font-size: 22px; font-weight: 900; color: #FFF; margin-bottom: 4px;">${activeSubject.subject}</div>
        <div class="mono" style="font-size: 12px; color: #E0E7FF;">⏰ ${activeSlot.label}</div>
      </div>
    `;
  } else {
    spotlightEl.innerHTML = `
      <div class="spotlight-card idle">
        <div class="mono" style="font-size: 11px; color: var(--text-muted); font-weight: 700;">STATUS</div>
        <div style="font-size: 16px; font-weight: 800; color: #FFF; margin-top: 4px;">No class currently ongoing</div>
        <div class="mono" style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Check schedule below for the next period</div>
      </div>
    `;
  }

  // Schedule Timeline List
  document.getElementById("scheduleContainer").innerHTML = list.map(item => {
    const slot = PERIOD_SLOTS.find(s => s.id === item.periodId);
    const isActive = item.periodId === activePeriodId;

    return `
      <div class="period-item ${isActive ? 'active-item' : ''}">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="subject-name" style="color: ${isActive ? 'var(--cyan)' : '#FFF'};">${item.subject}</span>
            ${isActive ? '<span class="live-pill" style="font-size: 8px; padding: 2px 6px;">NOW</span>' : ''}
          </div>
          <div class="mono" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
            ⏰ ${slot.label}
          </div>
        </div>
        <div style="font-size: 20px;">
          ${item.subject === 'LUNCH' ? '🍱' : item.subject.includes('LAB') ? '💻' : '📖'}
        </div>
      </div>
    `;
  }).join('');
}

function openSBTET() {
  navigator.clipboard.writeText(currentUser.pin);
  alert("PIN copied to clipboard! Opening SBTET Connect...");
  window.open("https://sbtetconnect.app", "_blank");
}

window.onload = init;
</script>
</body>
</html>
